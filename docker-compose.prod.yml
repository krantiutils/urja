services:
  api:
    image: ghcr.io/krantiutils/urja-api:${IMAGE_TAG:-latest}
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${DB_USER:-urja}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-urja}?sslmode=disable
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Lets CORS accept every gym's own subdomain without enumerating them.
      SITE_BASE_DOMAIN: ${SITE_BASE_DOMAIN:-nepalgym.xyz}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - traefik-proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.urja-api.rule=(Host(`nepalgym.xyz`) || Host(`www.nepalgym.xyz`)) && PathPrefix(`/api/`)
      - traefik.http.routers.urja-api.entrypoints=websecure
      - traefik.http.routers.urja-api.tls.certresolver=letsencrypt
      # Above both web routers, so /api/ on the apex reaches the API rather than
      # falling through to the frontend.
      - traefik.http.routers.urja-api.priority=20
      - traefik.http.services.urja-api.loadbalancer.server.port=8080
      - traefik.docker.network=traefik-proxy
    restart: unless-stopped

  web:
    image: ghcr.io/krantiutils/urja-web:${IMAGE_TAG:-latest}
    # No NEXT_PUBLIC_BASE_DOMAIN here on purpose: Next inlines NEXT_PUBLIC_* at
    # build time, so it is a build arg in web/Dockerfile. Setting it here would
    # look like it worked and change nothing.
    volumes:
      # Tenant-supplied photos and clips, served by Next from /app/public at
      # /media/<slug>/... . Read-only: nothing in the app writes here, and the
      # site module has no upload endpoint yet — files are placed on the host.
      # Kept outside the image so a gym's media survives a redeploy.
      - ./media:/app/public/media:ro
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true

      # Two routers onto one service, because the apex and a gym's own site are
      # not the same product.
      #
      # Apex — our marketing site and the authenticated app. Unchanged, including
      # the analytics tracker.
      - traefik.http.routers.urja-web.rule=Host(`nepalgym.xyz`) || Host(`www.nepalgym.xyz`)
      - traefik.http.routers.urja-web.entrypoints=websecure
      - traefik.http.routers.urja-web.tls.certresolver=letsencrypt
      - traefik.http.routers.urja-web.middlewares=inject-tracker@file
      - traefik.http.routers.urja-web.priority=10

      # Tenant gym sites. HostRegexp because tenants are created at runtime and
      # cannot be listed here.
      #
      # Deliberately no inject-tracker: these are our customers' own websites
      # and their visitors, and injecting a third-party script into them is
      # their decision to make, not one to inherit from a shared router.
      - traefik.http.routers.urja-tenants.rule=HostRegexp(`.+\.nepalgym\.xyz`)
      - traefik.http.routers.urja-tenants.entrypoints=websecure
      # DNS-01 (Porkbun) rather than HTTP-01: a wildcard certificate cannot be
      # issued from an HTTP challenge.
      - traefik.http.routers.urja-tenants.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.urja-tenants.tls.domains[0].main=nepalgym.xyz
      - traefik.http.routers.urja-tenants.tls.domains[0].sans=*.nepalgym.xyz
      # Below the apex router, so www falls to the apex rather than being
      # treated as a gym called "www".
      - traefik.http.routers.urja-tenants.priority=1

      - traefik.http.services.urja-web.loadbalancer.server.port=3000
      - traefik.docker.network=traefik-proxy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-urja}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-urja}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-urja}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  traefik-proxy:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
