name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urja
          POSTGRES_PASSWORD: urja_secret
          POSTGRES_DB: urja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urja"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Run linter
        run: go vet ./...

      - name: Run unit tests
        run: go test -v -race -count=1 -coverprofile=coverage-unit.out ./internal/... ./pkg/...

      - name: Run E2E tests
        env:
          E2E_DB_HOST: localhost
          E2E_DB_PORT: "5432"
          E2E_DB_USER: urja
          E2E_DB_PASSWORD: urja_secret
          E2E_DB_NAME: urja_test
          E2E_REDIS_HOST: localhost
          E2E_REDIS_PORT: "6379"
        run: |
          go test -v -count=1 -timeout 180s -coverprofile=coverage-e2e.out ./tests/e2e/... | tee tests/e2e/results/ci-test-run.txt

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage-e2e.out > tests/e2e/results/coverage.txt
          echo "--- Coverage Summary ---"
          tail -1 tests/e2e/results/coverage.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/e2e/results/
            coverage-unit.out
            coverage-e2e.out
